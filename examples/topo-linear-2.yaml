name: lab-ospf-multiarea
settings:
  env:
    - name: DEFENVVAR1
      value: xpto
  # hosts_kind: default
  # switches_kind: default
  # links_kind: default
hosts:
  pc1:
    ip: 192.168.1.1/24
    defaultRoute: via 192.168.1.254
  pc2:
    ip: 192.168.2.1/24
    defaultRoute: via 192.168.2.254
  r1:
    kind: k8spod
    image: hackinsdn/debian:latest
    # example of a useless pre-start commands to create
    # multiline files and run a few commands before link
    # setup
    preStart:
      - |
        cat << 'EOF' > /tmp/foobar.txt
        this is a file test 123

        test aa bbb $HOSTNAME
        EOF
        date >> /tmp/xpto2
      - hostname >> /tmp/xpto3-hostname
      - date >> /tmp/xpto4-date
  r2:
    kind: k8spod
    image: hackinsdn/debian:latest
    img_url: /assets/debian-server.png
switches:
  s1:
    kind: lxbr
links:
  - node1: pc1
    node2: r1
  - node1: pc2
    node2: r2
  - node1: r1
    node2: s1
  - node1: r2
    node2: s1
  - node1: r1
    node2: r2
